# Ajuda do MarkPlus (Starlight) no GitHub Pages. Este repositório é só a pasta docs/ do app;
# a tabela de atalhos é gerada no Mac (a partir do menu do app) e vem commitada.
name: Help site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v4
        with:
          # Astro 7 pede Node >= 22.23.4 (o padrão da action é mais antigo)
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
